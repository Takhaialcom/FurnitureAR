            );

            // تحديث البطاقة النشطة
            document.querySelectorAll('.preset-card').forEach(card => {
                card.classList.remove('border-2', 'border-blue-600', 'bg-blue-50/50');
                card.classList.add('border', 'border-slate-200', 'bg-white');
            });
            const activeCard = document.getElementById(`preset-${key}`);
            activeCard.classList.remove('border', 'border-slate-200', 'bg-white');
            activeCard.classList.add('border-2', 'border-blue-600', 'bg-blue-50/50');

            generateTemplateCode();
            showToast(`تم تحميل نموذج "${model.title}" بنسختي iOS و Android`);
        }

        // 5. رفع ملف GLB محلي من جهاز المستخدم (Android & Web + Auto-USDZ for iOS)
        function handleLocalGlbUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const objectUrl = URL.createObjectURL(file);
            progressBar.classList.remove('hide');
            updateBar.style.width = '15%';

            modelViewer.setAttribute('src', objectUrl);
            // إزالة ios-src القديم حتى لا يعرض نموذجاً مختلفاً على iOS، ليقوم العارض بالتحويل التلقائي
            modelViewer.removeAttribute('ios-src');

            currentSrcForCode = `models/${file.name}`;
            currentIosSrcForCode = '';

            document.getElementById('current-model-title').textContent = `ملف محلي: ${file.name}`;
            updatePlatformStatusBadges(file.name, '', false);

            document.querySelectorAll('.preset-card').forEach(card => {
                card.classList.remove('border-2', 'border-blue-600', 'bg-blue-50/50');
                card.classList.add('border', 'border-slate-200', 'bg-white');
            });

            generateTemplateCode();
            showToast(`تم تحميل "${file.name}". يمكنك أيضاً إرفاق ملف .usdz مخصص للآيفون إذا رغبت.`);
        }

        // 6. رفع ملف USDZ محلي مخصص لأجهزة iOS (Apple AR Quick Look)
        function handleLocalUsdzUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const objectUrl = URL.createObjectURL(file);
            modelViewer.setAttribute('ios-src', objectUrl);
            currentIosSrcForCode = `models/${file.name}`;

            const currentGlbName = document.getElementById('glb-file-label').textContent.replace('الحالي: ', '');
            updatePlatformStatusBadges(currentGlbName, file.name, true);

            generateTemplateCode();
            showToast(`تم ربط ملف iOS Quick Look "${file.name}" بنجاح!`);
        }

        // 7. تحميل روابط مخصصة لـ GLB (Android) و USDZ (iOS)
        function applyCustomModels() {
            const glbUrl = document.getElementById('glb-url-input').value.trim();
            const usdzUrl = document.getElementById('usdz-url-input').value.trim();

            if (!glbUrl && !usdzUrl) {
                showToast('يرجى إدخال رابط .glb للأندرويد أو رابط .usdz للآيفون أولاً.');
                return;
            }

            if (glbUrl) {
                progressBar.classList.remove('hide');
                updateBar.style.width = '15%';
                modelViewer.setAttribute('src', glbUrl);
                currentSrcForCode = glbUrl;
                document.getElementById('current-model-title').textContent = 'نموذج مخصص (Custom URL)';
            }

            if (usdzUrl) {
                modelViewer.setAttribute('ios-src', usdzUrl);
                currentIosSrcForCode = usdzUrl;
            } else if (glbUrl) {
                modelViewer.removeAttribute('ios-src');
                currentIosSrcForCode = '';
            }

            const glbName = glbUrl ? glbUrl.split('/').pop() : document.getElementById('glb-file-label').textContent.replace('الحالي: ', '');
            const usdzName = usdzUrl ? usdzUrl.split('/').pop() : '';
            updatePlatformStatusBadges(glbName, usdzName, Boolean(usdzUrl));

            generateTemplateCode();
            showToast('تم تحديث روابط النماذج لنظامي Android و iOS بنجاح!');
        }

        // 8. تحديث خصائص العارض (AR Placement, AR Scale, الإضاءة، الظلال، الدوران)
        function updateViewerAttributes() {
            const arPlacement = document.getElementById('select-ar-placement').value;
            const arScale = document.getElementById('select-ar-scale').value;
            const autoRotate = document.getElementById('toggle-autorotate').checked;
            const cameraControls = document.getElementById('toggle-controls').checked;
            const shadowIntensity = document.getElementById('range-shadow').value;
            const exposure = document.getElementById('range-exposure').value;
            const toneMapping = document.getElementById('select-tonemapping').value;

            document.getElementById('shadow-val-label').textContent = Number(shadowIntensity).toFixed(1);
            document.getElementById('exposure-val-label').textContent = Number(exposure).toFixed(1);

            modelViewer.setAttribute('ar-placement', arPlacement);
            modelViewer.setAttribute('ar-scale', arScale);

            if (autoRotate) {
                modelViewer.setAttribute('auto-rotate', '');
            } else {
                modelViewer.removeAttribute('auto-rotate');
            }

            if (cameraControls) {
                modelViewer.setAttribute('camera-controls', '');
            } else {
                modelViewer.removeAttribute('camera-controls');
            }

            modelViewer.setAttribute('shadow-intensity', shadowIntensity);
            modelViewer.setAttribute('exposure', exposure);
            modelViewer.setAttribute('tone-mapping', toneMapping);

            generateTemplateCode();
        }
<!-- ... existing code ... -->
        // 10. توليد كود القالب الرسمي مطابقاً للإعدادات الحالية (يدعم iOS و Android)
        function generateTemplateCode() {
            const arPlacement = document.getElementById('select-ar-placement').value;
            const arScale = document.getElementById('select-ar-scale').value;
            const autoRotate = document.getElementById('toggle-autorotate').checked ? '\n  auto-rotate' : '';
            const cameraControls = document.getElementById('toggle-controls').checked ? '\n  camera-controls' : '';
            const shadowIntensity = document.getElementById('range-shadow').value;
            const exposure = document.getElementById('range-exposure').value;
            const toneMapping = document.getElementById('select-tonemapping').value;
            const iosAttr = currentIosSrcForCode ? `\n  ios-src="${currentIosSrcForCode}"` : '';

            const template = `<!-- 1. تحميل مكتبة Google Model Viewer الرسمية v4.0.0 -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"><\/script>

<!-- 2. مكون عرض النموذج ثلاثي الأبعاد والواقع المعزز لنظامي iOS و Android -->
<model-viewer
  src="${currentSrcForCode}"${iosAttr}
  alt="نموذج ثلاثي الأبعاد مع دعم الواقع المعزز على iOS و Android"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="${arPlacement}"
  ar-scale="${arScale}"${cameraControls}
  touch-action="pan-y"
  tone-mapping="${toneMapping}"
  shadow-intensity="${shadowIntensity}"
  exposure="${exposure}"${autoRotate}
  style="width: 100%; height: 500px;"
>
  <!-- شريط تقدم التحميل الرسمي -->
  <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>

  <!-- زر تفعيل الواقع المعزز المخصص -->
  <button slot="ar-button" id="ar-button">
    عرض في مساحتك - AR
  </button>
</model-viewer>`;

            codeBox.value = template;
        }
<!-- ... existing code ... -->
        // تهيئة الكود وفحص نظام التشغيل عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            detectUserPlatform();
            generateTemplateCode();
        });
    </script>
</body>
