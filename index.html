<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Viewer AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="model.glb" 
    ios-src="model.usdz"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed" 
    camera-controls 
    touch-action="pan-y" 
    alt="A 3D model of an furniture" 
    shadow-intensity="2" 
    skybox-image="../../shared-assets/environments/spruit_sunrise_1k_HDR.jpg" 
    skybox-height="2m" 
    max-camera-orbit="auto 90deg auto" 
    xr-environment>
  </model-viewer>

</body>
</html>
